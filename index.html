<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>飞机打字母 - 英语学习游戏</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: linear-gradient(180deg, #0a0e27 0%, #1a1f3a 100%);
      font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #gameContainer {
      position: relative;
      width: 800px;
      height: 700px;
      border-radius: 12px;
      box-shadow: 0 0 40px rgba(0, 150, 255, 0.3);
      background: #0f1530;
    }
    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 12px;
    }
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }
    .hudItem {
      color: #fff;
      font-size: 18px;
      text-shadow: 0 0 10px rgba(0,0,0,0.5);
      padding: 8px 16px;
      border-radius: 8px;
      background: rgba(255,255,255,0.1);
    }
    .hpBar {
      display: flex;
      gap: 4px;
    }
    .hpDot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ff4444;
      box-shadow: 0 0 6px #ff4444;
    }
    .hpDot.empty {
      background: #444;
      box-shadow: none;
    }
    .score {
      color: #ffcc44;
      font-weight: bold;
    }
    .level {
      color: #88ff88;
    }
    .menu {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15,21,48,0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-radius: 12px;
      z-index: 10;
    }
    .menu.hidden {
      display: none;
    }
    .menuTitle {
      font-size: 48px;
      font-weight: bold;
      background: linear-gradient(180deg, #44ffcc, #4488ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 30px;
      text-shadow: 0 0 30px rgba(68,255,204,0.5);
    }
    .menuSubtitle {
      color: #aaa;
      font-size: 18px;
      margin-bottom: 40px;
    }
    .btn {
      background: linear-gradient(180deg, #4466ff, #3344cc);
      color: #fff;
      border: none;
      padding: 14px 45px;
      font-size: 20px;
      border-radius: 25px;
      cursor: pointer;
      margin: 8px;
      transition: all 0.2s;
      box-shadow: 0 4px 15px rgba(68,102,255,0.4);
    }
    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(68,102,255,0.6);
    }
    .levelGrid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin: 20px 0;
    }
    .levelBtn {
      background: rgba(255,255,255,0.08);
      color: #fff;
      border: 2px solid #4466ff;
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .levelBtn:hover {
      background: #4466ff;
    }
    .gameOverScore {
      font-size: 32px;
      color: #ffcc44;
      margin: 20px 0;
    }
    .instructions {
      color: #888;
      font-size: 14px;
      margin-top: 30px;
      text-align: center;
      line-height: 1.8;
    }
    .instructions strong {
      color: #aaa;
    }
    #controlsInfo {
      position: absolute;
      bottom: 15px;
      left: 0;
      right: 0;
      text-align: center;
      color: rgba(255,255,255,0.5);
      font-size: 14px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas" width="800" height="700"></canvas>
    
    <div id="hud">
      <div class="hudItem">
        <span>血量</span>
        <div class="hpBar" id="hpBar"></div>
      </div>
      <div class="hudItem score" id="scoreDisplay">得分: 0</div>
      <div class="hudItem level" id="levelDisplay">关卡: 1</div>
      <div class="hudItem" id="letterHint" style="font-size:16px;color:#88ccff;">下一个字母: </div>
    </div>
    
    <div class="menu" id="mainMenu">
      <div class="menuTitle">✈️ 飞机打字母</div>
      <div class="menuSubtitle">在射击游戏中快乐学英语！</div>
      <button class="btn" id="startBtn">开始游戏</button>
      <button class="btn" id="levelSelectBtn">选择关卡</button>
      <div class="instructions">
        <strong>操作说明</strong><br>
        左右方向键控制飞机移动对齐空位<br>
        字母键发射字母子弹（对准空位填写）<br>
        数字键1-4发射数字子弹（选择题）<br>
        ESC 暂停游戏
      </div>
    </div>
    
    <div class="menu hidden" id="levelSelectMenu">
      <div class="menuTitle">选择关卡</div>
      <div class="levelGrid" id="levelGrid"></div>
      <button class="btn" id="backToMainBtn">返回</button>
    </div>
    
    <div class="menu hidden" id="pauseMenu">
      <div class="menuTitle">游戏暂停</div>
      <button class="btn" id="resumeBtn">继续游戏</button>
      <button class="btn" id="restartBtn">重新开始</button>
      <button class="btn" id="pauseBackBtn">返回菜单</button>
    </div>
    
    <div class="menu hidden" id="gameOverMenu">
      <div class="menuTitle">游戏结束</div>
      <div class="gameOverScore" id="finalScore">得分: 0</div>
      <button class="btn" id="retryBtn">再试一次</button>
      <button class="btn" id="menuBtn">返回菜单</button>
    </div>
    
    <div class="menu hidden" id="levelCompleteMenu">
      <div class="menuTitle">🎉 关卡完成！</div>
      <div class="gameOverScore" id="levelScore">得分: 0</div>
      <button class="btn" id="nextLevelBtn">下一关</button>
      <button class="btn" id="levelMenuBtn">返回菜单</button>
    </div>
    
    <div id="controlsInfo">
      左右移动飞机对准填空位 | 字母键填空 | 数字键1-4答题 | ESC暂停
    </div>
  </div>

  <script src="js/questions.js"></script>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function getMajorLevelData(major) {
      const key = 'major' + major;
      if (NEW_CONCEPT_QUESTIONS && NEW_CONCEPT_QUESTIONS[key]) {
        return NEW_CONCEPT_QUESTIONS[key];
      }
      console.error('题库数据不存在: major' + major);
      return null;
    }

    const Game = {
      state: 'menu', // menu, playing, paused, gameOver, levelComplete
      score: 0,
      hp: 10,
      maxHp: 10,
      combo: 0,
      maxCombo: 0,
      currentMajor: 1,
      currentSub: 'sub1',
      currentQuestionIndex: 0,
      questions: [],
      
      // 预加载语音引擎
      initVoice() {
        if ('speechSynthesis' in window) {
          // 触发声音列表加载
          window.speechSynthesis.getVoices();
          // Chrome 需要事件触发
          window.speechSynthesis.onvoiceschanged = () => {
            window.speechSynthesis.getVoices();
          };
        }
      },
      
      // 玩家
      player: {
        x: 400,
        y: 600,
        width: 60,
        height: 50,
        speed: 8
      },
      
      // 游戏对象
      bullets: [],
      enemies: [],
      particles: [],
      powerUps: [],
      
      // 键盘
      keys: {},
      
      // 计时器
      lastTime: 0,
      enemySpawnTimer: 0,
      enemySpawnInterval: 3000,
      
      // 初始化
      init() {
        this.initVoice();
        this.setupEvents();
        this.gameLoop();
        this.updateLevelGrid();
      },
      
      setupEvents() {
        // 菜单按钮
        document.getElementById('startBtn').onclick = () => this.startGame();
        document.getElementById('levelSelectBtn').onclick = () => this.showLevelSelect();
        document.getElementById('backToMainBtn').onclick = () => this.showMainMenu();
        document.getElementById('resumeBtn').onclick = () => this.resumeGame();
        document.getElementById('restartBtn').onclick = () => this.restartLevel();
        document.getElementById('pauseBackBtn').onclick = () => this.showMainMenu();
        document.getElementById('retryBtn').onclick = () => this.restartLevel();
        document.getElementById('menuBtn').onclick = () => this.showMainMenu();
        document.getElementById('nextLevelBtn').onclick = () => this.nextLevel();
        document.getElementById('levelMenuBtn').onclick = () => this.showMainMenu();
        
        // 键盘
        window.addEventListener('keydown', (e) => {
          // 方向键单独处理，不转为小写
          if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
            this.keys[e.key] = true;
          } else {
            this.keys[e.key.toLowerCase()] = true;
          }
          if (this.state === 'playing') {
            this.handleInput(e.key.toLowerCase(), e.key);
          }
          if (e.key === 'Escape') {
            if (this.state === 'playing') this.pauseGame();
            else if (this.state === 'paused') this.resumeGame();
          }
        });
        window.addEventListener('keyup', (e) => {
          if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
            this.keys[e.key] = false;
          } else {
            this.keys[e.key.toLowerCase()] = false;
          }
        });
      },
      
      showMainMenu() {
        this.state = 'menu';
        this.hideAllMenus();
        document.getElementById('mainMenu').classList.remove('hidden');
      },
      
      showLevelSelect() {
        this.hideAllMenus();
        document.getElementById('levelSelectMenu').classList.remove('hidden');
      },
      
      hideAllMenus() {
        document.querySelectorAll('.menu').forEach(m => m.classList.add('hidden'));
      },
      
      updateLevelGrid() {
        const grid = document.getElementById('levelGrid');
        grid.innerHTML = '';
        for (let i = 1; i <= 12; i++) {
          const btn = document.createElement('button');
          btn.className = 'levelBtn';
          btn.textContent = `第${i}大关`;
          btn.onclick = () => {
            this.currentMajor = i;
            this.currentSub = 'sub1';
            this.startGame();
          };
          grid.appendChild(btn);
        }
      },
      
      startGame() {
        this.state = 'playing';
        this.hideAllMenus();
        this.score = 0;
        this.hp = this.maxHp;
        this.combo = 0;
        this.maxCombo = 0;
        this.currentQuestionIndex = 0;
        this.bullets = [];
        this.enemies = [];
        this.particles = [];
        this.powerUps = [];
        this.enemySpawnTimer = 0;

        this.loadQuestions();
        this.updateHUD();
      },
      
      loadQuestions() {
        const data = getMajorLevelData(this.currentMajor);
        if (data && data[this.currentSub] && data[this.currentSub].questions) {
          this.questions = [...data[this.currentSub].questions];
        } else {
          console.error('题库加载失败:', this.currentMajor, this.currentSub);
          this.questions = [];
        }
        if (this.questions.length === 0) {
          console.error('题目列表为空!');
        }
        this.shuffleArray(this.questions);
      },
      
      shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
      },
      
      pauseGame() {
        this.state = 'paused';
        document.getElementById('pauseMenu').classList.remove('hidden');
      },

      resumeGame() {
        this.state = 'playing';
        this.hideAllMenus();
      },

      restartLevel() {
        this.startGame();
      },

      nextLevel() {
        const subLevels = ['sub1', 'sub2', 'sub3', 'combo'];
        const idx = subLevels.indexOf(this.currentSub);
        if (idx < subLevels.length - 1) {
          this.currentSub = subLevels[idx + 1];
        } else {
          this.currentMajor++;
          this.currentSub = 'sub1';
        }
        if (this.currentMajor > 12) this.currentMajor = 1;
        this.startGame();
      },
      
      gameOver() {
        this.state = 'gameOver';
        document.getElementById('finalScore').textContent = `得分: ${this.score}`;
        document.getElementById('gameOverMenu').classList.remove('hidden');
      },

      levelComplete() {
        this.state = 'levelComplete';
        document.getElementById('levelScore').textContent = `得分: ${this.score}`;
        document.getElementById('levelCompleteMenu').classList.remove('hidden');
      },
      
      handleInput(key, originalKey) {
        // 字母键或数字键（不处理方向键）
        if (key.length === 1 && ((key >= 'a' && key <= 'z') || (key >= '1' && key <= '4'))) {
          this.fireBullet(key);
        }
      },
      
      fireBullet(key) {
        const isNumber = key >= '1' && key <= '4';
        this.bullets.push({
          x: this.player.x,
          y: this.player.y - 30,
          vx: 0,
          vy: -14,
          key: key.toUpperCase(),
          isNumber,
          size: isNumber ? 28 : 24,
          color: isNumber ? '#ff8844' : '#ffcc44',
          targetEnemy: this.enemies.length > 0 ? this.enemies[0] : null,
          success: false,
          trail: [],
          lifetime: 0
        });
      },
      
      checkBulletHitInUpdate(bullet) {
        const enemy = bullet.targetEnemy;
        if (!enemy || !this.enemies.includes(enemy)) return false;
        
        // 子弹到达敌人位置
        if (bullet.y > enemy.y - enemy.height/2) {
          if (enemy.type === 'choice') {
            // 选择题
            const correctIdx = enemy.answer.toUpperCase().charCodeAt(0) - 'A'.charCodeAt(0) + 1;
            if (bullet.key === String(correctIdx)) {
              bullet.success = true;
              bullet.lifetime = 30;
              this.hitEnemy(enemy);
              return false;
            }
            return true;
          } else {
            // 填空题：按顺序填写空位
            const answer = enemy.answer.toLowerCase().replace(/\s/g, '');
            const nextFillIdx = enemy.filledLetters.findIndex(l => l === null);
            if (nextFillIdx === -1) return true;
            
            const idx = enemy.emptyIndices[nextFillIdx];
            
            // 计算空位在屏幕上的X位置
            const chars = enemy.displayText.split(' ');
            const charWidth = 28;
            const totalWidth = chars.length * charWidth;
            const blankX = enemy.x - totalWidth / 2 + idx * charWidth + charWidth / 2;
            
            // 检查子弹是否对准空位
            if (Math.abs(bullet.x - blankX) < charWidth + 5) {
              if (answer[idx] === bullet.key.toLowerCase()) {
                bullet.success = true;
                bullet.lifetime = 30;
                // 正确字母，填入空位
                enemy.filledLetters[nextFillIdx] = bullet.key.toLowerCase();
                enemy.updateDisplayText();
                
                // 检查是否全部填完
                if (enemy.filledLetters.every(l => l !== null)) {
                  this.hitEnemy(enemy);
                } else {
                  // 部分正确
                  this.createMiniHit(enemy.x, enemy.y);
                  this.combo++;
                  this.score += enemy.difficulty * 30;
                  this.updateHUD();
                }
                return false;
              }
              // 对准了但字母错误，子弹穿过不处理
              return false;
            }
            // 没对准空位，子弹穿过不处理
            return false;
          }
        }
        return false;
      },
      
      hitEnemy(enemy) {
        this.createExplosion(enemy.x, enemy.y);
        this.enemies = this.enemies.filter(e => e !== enemy);
        
        // 延迟朗读，让爆炸效果先播放
        const text = enemy.readText || enemy.answer;
        setTimeout(() => {
          this.speakEnglish(text);
        }, 300);
        
        this.combo++;
        if (this.combo > this.maxCombo) this.maxCombo = this.combo;
        this.score += enemy.difficulty * 100 * (1 + Math.floor(this.combo / 5));
        this.updateHUD();
      },
      
      createExplosion(x, y) {
        for (let i = 0; i < 20; i++) {
          const angle = (Math.PI * 2 * i) / 20;
          const speed = 2 + Math.random() * 3;
          this.particles.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1,
            color: ['#ff4444', '#ffcc44', '#ff8844'][Math.floor(Math.random() * 3)],
            size: 4 + Math.random() * 4
          });
        }
      },
      
      createMiniHit(x, y) {
        for (let i = 0; i < 8; i++) {
          const angle = (Math.PI * 2 * i) / 8;
          const speed = 1.5 + Math.random() * 2;
          this.particles.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 0.6,
            color: '#44ff88',
            size: 3 + Math.random() * 3
          });
        }
      },
      
      speakEnglish(text) {
        if (!('speechSynthesis' in window)) return;
        try {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'en-US';
          utterance.rate = 0.85;
          utterance.pitch = 1.1;
          utterance.volume = 2.0;
          
          // 获取可用声音（可能异步加载中）
          const loadVoices = () => {
            const voices = window.speechSynthesis.getVoices();
            if (voices.length > 0) {
              const bestVoice = voices.find(v => v.lang.startsWith('en') && v.name.includes('Female'))
                           || voices.find(v => v.lang.startsWith('en-US'))
                           || voices.find(v => v.lang.startsWith('en'));
              if (bestVoice) utterance.voice = bestVoice;
            }
          };
          loadVoices();
          
          // 有些浏览器需要异步等待声音加载
          if (window.speechSynthesis.onvoiceschanged !== undefined) {
            window.speechSynthesis.onvoiceschanged = loadVoices;
          }
          
          // 朗读时在控制台显示
          console.log('🔊 朗读:', text);
          speechSynthesis.speak(utterance);
        } catch (e) {
          console.log('语音朗读出错:', e);
        }
      },

      updateHUD() {
        document.getElementById('scoreDisplay').textContent = `得分: ${this.score}`;
        document.getElementById('levelDisplay').textContent = `关卡: ${this.currentMajor}-${this.currentSub}`;
        
        const hpBar = document.getElementById('hpBar');
        hpBar.innerHTML = '';
        for (let i = 0; i < this.maxHp; i++) {
          const dot = document.createElement('div');
          dot.className = `hpDot ${i >= this.hp ? 'empty' : ''}`;
          hpBar.appendChild(dot);
        }
        
        // 显示下一个需要填写的字母提示
        const hintEl = document.getElementById('letterHint');
        if (hintEl && this.enemies.length > 0) {
          const e = this.enemies[0];
          if (e.type === 'fill') {
            const nextFillIdx = e.filledLetters.findIndex(l => l === null);
            if (nextFillIdx !== -1) {
              const idx = e.emptyIndices[nextFillIdx];
              const answer = e.answer.toLowerCase().replace(/\s/g, '');
              hintEl.textContent = `按下字母: ${answer[idx]}`;
              hintEl.style.color = '#88ccff';
            } else {
              hintEl.textContent = '';
            }
          } else {
            const correctIdx = e.answer.charCodeAt(0) - 'A'.charCodeAt(0) + 1;
            hintEl.textContent = `按下数字: ${correctIdx}`;
            hintEl.style.color = '#ff8844';
          }
        } else if (hintEl) {
          hintEl.textContent = '';
        }
      },
      
      spawnEnemy() {
        // 每次只显示一道题
        if (this.enemies.length > 0) return;

        // 如果没有题目,游戏结束
        if (this.questions.length === 0) {
          console.error('没有可用题目,游戏结束');
          this.gameOver();
          return;
        }
        
        if (this.currentQuestionIndex >= this.questions.length) {
          if (this.enemies.length === 0) {
            this.levelComplete();
          }
          return;
        }
        
        const q = this.questions[this.currentQuestionIndex];
        this.currentQuestionIndex++;
        
        const type = (q.type === 'grammar_choice' || q.type === 'translate_en2cn') ? 'choice' : 'fill';
        
        // 生成填空题的显示文本和空位信息
        let displayText = '';
        let emptyIndices = [];
        let filledLetters = [];
        
        if (type === 'fill') {
          const answer = q.answer.replace(/\s/g, '');
          // 只隐藏1-3个字母
          const hideCount = Math.min(Math.max(1, Math.floor(answer.length / 3)), 3);
          const hideIndices = new Set();
          while (hideIndices.size < hideCount) {
            hideIndices.add(Math.floor(Math.random() * answer.length));
          }
          for (let i = 0; i < answer.length; i++) {
            if (hideIndices.has(i)) {
              displayText += '_ ';
              emptyIndices.push(i);
              filledLetters.push(null);
            } else {
              displayText += answer[i] + ' ';
            }
          }
        } else {
          displayText = q.question;
        }
        
        const enemy = {
          x: canvas.width / 2,
          y: type === 'choice' ? -60 : -45,
          width: type === 'choice' ? 400 : 280,
          height: type === 'choice' ? 160 : 90,
          vy: 0.35,
          opacity: 0,
          question: q.question,
          answer: q.answer,
          hint: q.hint,
          chinese: q.chinese,
          options: q.options,
          type,
          difficulty: q.difficulty,
          displayText: displayText.trim(),
          emptyIndices,
          filledLetters,
          hit: false,
          // 构建朗读文本
          readText: (function() {
            if (type === 'choice') {
              if (q.type === 'translate_en2cn') {
                return q.question;
              }
              const idx = q.answer.charCodeAt(0) - 'A'.charCodeAt(0);
              return (q.options && q.options[idx]) || q.answer;
            }
            if (q.type === 'spelling') {
              return q.answer;
            }
            if (q.type === 'translate_cn2en') {
              // 汉译英：朗读英文句子，首字母大写
              let sentence = q.answer;
              if (sentence.length > 0) {
                sentence = sentence[0].toUpperCase() + sentence.slice(1);
              }
              if (!sentence.endsWith('.') && !sentence.endsWith('?') && !sentence.endsWith('!')) {
                sentence += '.';
              }
              return sentence;
            }
            if (q.type === 'grammar_fill') {
              let sentence = q.question.replace(/_{3,}/g, q.answer);
              if (sentence.length > 0) {
                sentence = sentence[0].toUpperCase() + sentence.slice(1);
              }
              return sentence;
            }
            return q.answer;
          })(),
          updateDisplayText() {
            const answer = q.answer.replace(/\s/g, '').toLowerCase();
            let text = '';
            let emptyIdx = 0;
            for (let i = 0; i < answer.length; i++) {
              if (this.emptyIndices.includes(i)) {
                const filled = this.filledLetters[emptyIdx];
                text += (filled ? filled : '_') + ' ';
                emptyIdx++;
              } else {
                text += answer[i] + ' ';
              }
            }
            this.displayText = text.trim();
          }
        };
        
        this.enemies.push(enemy);
      },
      
      update(dt) {
        if (this.state !== 'playing') return;
        
        // 玩家移动 - 只使用方向键
        if (this.keys['ArrowLeft']) {
          this.player.x -= this.player.speed;
        }
        if (this.keys['ArrowRight']) {
          this.player.x += this.player.speed;
        }
        this.player.x = Math.max(40, Math.min(760, this.player.x));
        
        // 生成敌人
        this.enemySpawnTimer += dt;
        if (this.enemySpawnTimer >= this.enemySpawnInterval) {
          this.enemySpawnTimer = 0;
          this.spawnEnemy();
        }
        
        // 更新敌人
        for (let i = this.enemies.length - 1; i >= 0; i--) {
          const e = this.enemies[i];
          e.y += e.vy;
          
          // 淡入效果
          if (e.opacity < 1) {
            e.opacity = Math.min(1, e.opacity + 0.03);
          }
          
          if (e.y > canvas.height - 50) {
            this.enemies.splice(i, 1);
            this.hp--;
            this.combo = 0;
            this.updateHUD();
            if (this.hp <= 0) {
              this.gameOver();
            }
          }
        }
        
        // 更新子弹
        for (let i = this.bullets.length - 1; i >= 0; i--) {
          const b = this.bullets[i];
          
          // 添加轨迹点
          if (!b.success) {
            b.trail.push({ x: b.x, y: b.y });
            if (b.trail.length > 8) b.trail.shift();
          }
          
          if (b.success) {
            // 成功命中效果：慢慢上升，扩大，变绿
            b.vy = -3;
            b.lifetime--;
            b.size += 0.5;
            b.color = '#44ff88';
            if (b.lifetime <= 0) {
              this.bullets.splice(i, 1);
            }
          } else {
            b.x += b.vx;
            b.y += b.vy;
            
            // 检查子弹是否击中敌人
            if (this.checkBulletHitInUpdate(b)) {
              this.bullets.splice(i, 1);
              continue;
            }
            
            if (b.y < -50) {
              this.bullets.splice(i, 1);
            }
          }
        }
        
        // 更新粒子
        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.life -= 0.02;
          p.vy += 0.1;
          if (p.life <= 0) {
            this.particles.splice(i, 1);
          }
        }
        
        // 刷新提示
        this.updateHUD();
      },
      
      draw() {
        // 清空画布
        ctx.fillStyle = '#0f1530';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // 星空背景
        this.drawStars();
        
        // 敌人
        for (const e of this.enemies) {
          this.drawEnemy(e);
        }
        
        // 对齐引导线
        this.drawAlignmentGuide();
        
        // 子弹
        for (const b of this.bullets) {
          this.drawBullet(b);
        }
        
        // 粒子
        for (const p of this.particles) {
          this.drawParticle(p);
        }
        
        // 玩家
        this.drawPlayer();
      },
      
      drawStars() {
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        for (let i = 0; i < 50; i++) {
          const x = (i * 157) % canvas.width;
          const y = (i * 271) % canvas.height;
          const size = (i % 3) + 1;
          ctx.beginPath();
          ctx.arc(x, y, size, 0, Math.PI * 2);
          ctx.fill();
        }
      },
      
      drawPlayer() {
        const x = this.player.x;
        const y = this.player.y;
        
        // 飞机身体
        ctx.save();
        ctx.translate(x, y);
        
        // 翅膀
        ctx.fillStyle = '#4488ff';
        ctx.beginPath();
        ctx.moveTo(-30, 10);
        ctx.lineTo(0, -20);
        ctx.lineTo(30, 10);
        ctx.lineTo(10, 5);
        ctx.lineTo(0, 20);
        ctx.lineTo(-10, 5);
        ctx.closePath();
        ctx.fill();
        
        // 机身
        ctx.fillStyle = '#3366cc';
        ctx.beginPath();
        ctx.ellipse(0, 0, 15, 25, 0, 0, Math.PI * 2);
        ctx.fill();
        
        // 驾驶舱
        ctx.fillStyle = '#88ccff';
        ctx.beginPath();
        ctx.ellipse(0, -8, 8, 12, 0, 0, Math.PI * 2);
        ctx.fill();
        
        // 引擎火焰
        ctx.fillStyle = '#ff8844';
        ctx.beginPath();
        ctx.moveTo(-6, 20);
        ctx.lineTo(0, 35 + Math.random() * 5);
        ctx.lineTo(6, 20);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#ffcc44';
        ctx.beginPath();
        ctx.moveTo(-3, 20);
        ctx.lineTo(0, 28 + Math.random() * 4);
        ctx.lineTo(3, 20);
        ctx.closePath();
        ctx.fill();
        
        ctx.restore();
      },
      
      drawAlignmentGuide() {
        if (this.enemies.length === 0) return;
        const e = this.enemies[0];
        if (e.type !== 'fill') return;
        
        const nextFillIdx = e.filledLetters.findIndex(l => l === null);
        if (nextFillIdx === -1) return;
        
        const chars = e.displayText.split(' ');
        const charWidth = 28;
        const totalWidth = chars.length * charWidth;
        const idx = e.emptyIndices[nextFillIdx];
        const blankX = e.x - totalWidth / 2 + idx * charWidth + charWidth / 2;
        
        // 从飞机到目标空位的虚线引导线
        ctx.save();
        ctx.setLineDash([4, 6]);
        ctx.strokeStyle = 'rgba(255, 102, 68, 0.3)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(this.player.x, this.player.y - 30);
        ctx.lineTo(blankX, e.y - e.height / 2);
        ctx.stroke();
        ctx.restore();
        
        // 在空位位置显示一个目标环
        ctx.save();
        ctx.strokeStyle = '#ff6644';
        ctx.lineWidth = 2;
        ctx.setLineDash([3, 5]);
        ctx.beginPath();
        ctx.arc(blankX, e.y - e.height / 2 - 10, 16, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      },
      
      drawEnemy(e) {
        ctx.save();
        ctx.globalAlpha = e.opacity || 1;
        ctx.translate(e.x, e.y);
        
        // 背景框
        ctx.fillStyle = 'rgba(20,30,60,0.9)';
        ctx.strokeStyle = '#ff6644';
        ctx.lineWidth = 3;
        const w = e.width;
        const h = e.height;
        ctx.beginPath();
        ctx.roundRect(-w/2, -h/2, w, h, 10);
        ctx.fill();
        ctx.stroke();
        
        // 内容
        ctx.textAlign = 'center';
        
        if (e.type === 'fill') {
          // 填空题目
          ctx.fillStyle = '#ffcc44';
          ctx.font = 'bold 36px Arial';
          ctx.textAlign = 'center';
          
          // 逐字绘制，高亮当前需要填写的空位
          const chars = e.displayText.split(' ');
          const charWidth = 28;
          const totalWidth = chars.length * charWidth;
          const startX = -totalWidth / 2 + charWidth / 2;
          const nextFillIdx = e.filledLetters.findIndex(l => l === null);
          
          for (let i = 0; i < chars.length; i++) {
            const x = startX + i * charWidth;
            const emptyPos = e.emptyIndices.indexOf(i);
            const isFilled = emptyPos !== -1 && e.filledLetters[emptyPos] !== null;
            const isEmpty = emptyPos !== -1 && !isFilled;
            
            if (isEmpty) {
              if (emptyPos === nextFillIdx) {
                // 当前需要填的空位 - 闪烁高亮
                ctx.fillStyle = Math.floor(Date.now() / 400) % 2 ? '#ff6644' : '#ffcc44';
                ctx.font = 'bold 38px Arial';
              } else {
                ctx.fillStyle = '#ffcc44';
                ctx.font = 'bold 36px Arial';
              }
            } else if (isFilled) {
              // 已填的空位 - 绿色显示
              ctx.fillStyle = '#44ff88';
              ctx.font = 'bold 36px Arial';
            } else {
              ctx.fillStyle = '#ffcc44';
              ctx.font = 'bold 36px Arial';
            }
            ctx.fillText(chars[i], x, 5);
          }
          
          if (e.chinese) {
            ctx.fillStyle = '#aaaacc';
            ctx.font = '18px "Microsoft YaHei", sans-serif';
            ctx.fillText(e.chinese, 0, 38);
          }
        } else {
          // 选择题目
          ctx.fillStyle = '#ffcc44';
          ctx.font = 'bold 20px "Microsoft YaHei", sans-serif';
          ctx.textAlign = 'center';
          // 分行显示问题
          const qLines = this.wrapText(e.question, 300, '20px "Microsoft YaHei"');
          qLines.forEach((line, i) => {
            ctx.fillText(line, 0, -h/2 + 30 + i * 24);
          });
          
          if (e.options) {
            const labels = ['1', '2', '3', '4'];
            for (let i = 0; i < e.options.length; i++) {
              ctx.textAlign = 'left';
              const xOff = -w/2 + 25 + (i % 2) * 185;
              const yOff = -h/2 + 60 + Math.floor(i / 2) * 32;
              ctx.fillStyle = '#ff8844';
              ctx.font = 'bold 16px Arial';
              ctx.fillText(labels[i] + '.', xOff, yOff);
              ctx.fillStyle = '#fff';
              ctx.font = '15px "Microsoft YaHei", sans-serif';
              ctx.fillText(e.options[i], xOff + 22, yOff);
            }
          }
        }
        
        ctx.restore();
      },
      
      drawBullet(b) {
        // 绘制轨迹
        for (let i = 0; i < b.trail.length; i++) {
          const t = b.trail[i];
          const alpha = (i + 1) / b.trail.length * 0.5;
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.fillStyle = b.color;
          ctx.beginPath();
          ctx.arc(t.x, t.y, b.size * 0.5 * (i + 1) / b.trail.length, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
        
        ctx.save();
        ctx.translate(b.x, b.y);
        
        if (b.success) {
          // 成功发光效果
          ctx.shadowColor = b.color;
          ctx.shadowBlur = 20 + (30 - b.lifetime) * 2;
        } else {
          // 普通发光效果
          ctx.shadowColor = b.color;
          ctx.shadowBlur = 15;
        }
        
        // 圆背景
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.arc(0, 0, b.size, 0, Math.PI * 2);
        ctx.fill();
        
        // 字母
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#000';
        ctx.font = `bold ${b.size - 4}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(b.key, 0, 0);
        
        ctx.restore();
      },
      
      drawParticle(p) {
        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      },
      
      wrapText(text, maxWidth, font) {
        ctx.font = font;
        const words = text.split('');
        const lines = [];
        let currentLine = '';
        for (const ch of words) {
          const testLine = currentLine + ch;
          if (ctx.measureText(testLine).width > maxWidth && currentLine) {
            lines.push(currentLine);
            currentLine = ch;
          } else {
            currentLine = testLine;
          }
        }
        if (currentLine) lines.push(currentLine);
        return lines.length > 0 ? lines : [text];
      },
      
      gameLoop(timestamp = 0) {
        const dt = timestamp - this.lastTime;
        this.lastTime = timestamp;
        
        if (this.state === 'playing') {
          this.update(dt);
        }
        this.draw();
        
        requestAnimationFrame((t) => this.gameLoop(t));
      }
    };
    
    // 启动游戏
    Game.init();
  </script>
